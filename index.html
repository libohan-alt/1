<!DOCTYPE html>
<html lang="ZH-CN">
<head>
    <meta charset="UTF-8">
    <title>英语学习工具</title>

            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            gap: 20px;
            padding: 40px 20px;
        }

        .glasscard {
            font-size: 72px;
            font-family: "华文楷体", "STXingkai", cursive;
            position: relative;
            z-index: 10;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 48px 56px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: whitesmoke;
            text-align: center;
            mix-blend-mode: difference;
            min-width: 320px;
            max-width: 800px;
            width: 90%;
        }
    </style>
</head>
<body>
<h1 style="text-align: center;">英语学习工具</h1>
<div class="glasscard">
    <button onclick="window.location.href='two.html'" class="glasscard">Already / Just / Yet

</div>
<div class="glasscard">
